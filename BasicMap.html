<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map with Manageable Key Points</title>
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <style>
        /* Set the size of the map container */
        #map {
            height: 500px;
            width: 100%;
        }

        /* Styling for the custom controls */
        .custom-control {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 1000;
        }

        /* Modal styling */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        .modal-content ul {
            list-style: none;
            padding: 0;
        }

        .modal-content ul li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-content ul li button {
            margin-left: 10px;
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <h1>Leaflet Map with Manageable Key Points</h1>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Key Points Modal -->
    <div id="keypoints-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeKeyPointsModal()">&times;</span>
            <h4>Key Points</h4>
            <ul id="keypoints-list"></ul>
        </div>
    </div>

    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        const map = L.map('map').setView([51.505, -0.09], 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Array to store key points
        const keyPoints = [];

        // Key Point Mode toggle
        let isKeyPointModeEnabled = false;

        // Add custom control for the buttons
        const customControl = L.control({ position: 'bottomright' });

        customControl.onAdd = function(map) {
            const container = L.DomUtil.create('div', 'custom-control');
            container.style.cursor = 'pointer';
            L.DomEvent.disableClickPropagation(container);

            // Enable Key Point Mode button
            const enableButton = document.createElement('button');
            enableButton.textContent = 'Make a Key Point';
            enableButton.addEventListener('click', () => {
                isKeyPointModeEnabled = true;
                alert('Click on the map to place your Key Point, NOTE: your zoom level will be saved.');
            });

            // View Key Points button
            const pointsButton = document.createElement('button');
            pointsButton.textContent = 'View Key Points';
            pointsButton.addEventListener('click', openKeyPointsModal);

            container.appendChild(enableButton);
            container.appendChild(pointsButton);

            return container;
        };

        customControl.addTo(map);

        // Function to add a new key point
        function addKeyPoint(latlng) {
            const currentZoom = map.getZoom(); // Save the current zoom level
            const name = prompt('Enter a name for this key point:');
            if (!name) return; // Exit if no name is provided

            const marker = L.marker(latlng).addTo(map).bindPopup(`<b>${name}</b>`);
            keyPoints.push({ name, latlng, marker, zoom: currentZoom }); // Save zoom level
        }

        // Function to open the Key Points modal
        function openKeyPointsModal() {
            const modal = document.getElementById('keypoints-modal');
            const modalList = document.getElementById('keypoints-list');
            modalList.innerHTML = ''; // Clear existing list

            keyPoints.forEach((keyPoint, index) => {
                const listItem = document.createElement('li');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = keyPoint.name;
                nameSpan.style.cursor = 'pointer';
                nameSpan.addEventListener('click', () => {
                    map.setView(keyPoint.latlng, keyPoint.zoom); // Focus on the point and restore the zoom level
                    closeKeyPointsModal(); // Close the modal after focusing on the point
                });

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => {
                    map.removeLayer(keyPoint.marker); // Remove marker from map
                    keyPoints.splice(index, 1); // Remove from array
                    openKeyPointsModal(); // Refresh the modal
                });

                listItem.appendChild(nameSpan);
                listItem.appendChild(deleteButton);
                modalList.appendChild(listItem);
            });

            modal.style.display = 'block'; // Show the modal
        }

        // Function to close the Key Points modal
        function closeKeyPointsModal() {
            const modal = document.getElementById('keypoints-modal');
            modal.style.display = 'none';
        }

        // Map click event to add key points
        map.on('click', (e) => {
            if (isKeyPointModeEnabled) {
                addKeyPoint(e.latlng); // Add key point after clicking
                isKeyPointModeEnabled = false; // Disable Key Point Mode after adding
            }
        });
    </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>


<script>
    // Array to store markers
    const markers = [];

    // Function to handle file selection and parse the Excel file
    function importExcelFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx';
        input.addEventListener('change', handleFile);
        input.click();
    }

    // Function to process the selected file
    function handleFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0]; // Use the first sheet
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { raw: true });
            processExcelData(json);
        };
        reader.readAsArrayBuffer(file);
    }

    // Function to process Excel data and place markers on the map
    function processExcelData(data) {
        data.forEach(row => {
            const lat = parseFloat(row.Latitude); // Replace with the actual column name for latitude
            const lng = parseFloat(row.Longitude); // Replace with the actual column name for longitude
            const name = row["Unit Name"] || "Unnamed Unit" ; // name for the name

            if (!isNaN(lat) && !isNaN(lng)) {
                const marker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>${name}</b>`);
                markers.push(marker);
            }
        });
        alert(`${data.length} units added to the map.`);
    }

    // Example integration for triggering the file import
    const importButton = document.createElement('button');
    importButton.textContent = 'Import Units from Excel';
    importButton.style.margin = '10px';
    importButton.onclick = importExcelFile;

    // Add the button to the map container or document
    document.body.appendChild(importButton);
</script>


<script>
// Example unit data (you can replace this with data from your Excel file)
const unitData = [
    {
        id: 1,
        name: "Unit Alpha",
        details: "Unit Alpha is responsible for logistics and supplies.<br><br>Commander: Lt Col Smith<br>Prsnl Assigned: 45<br>Prsnl Available: 32",
        coords: [45.505, -0.09]
    },
    {
        id: 2,
        name: "Unit Bravo",
        details: "Unit Bravo handles communication and operations.<br><br>Commander: Maj Johnston<br>Prsnl Assigned: 45<br>Prsnl Available: 30",
        coords: [51.51, 10.1]
    },
    {
        id: 3,
        name: "Unit Charlie",
        details: "Unit Charlie specializes in field reconnaissance.<br><br>Commander: Lt Col Bridges<br>Prsnl Assigned: 10<br>Prsnl Available: 10",
        coords: [51.51, -0.08]
    }
];

// Define custom icons for each unit
const customIcons = {
    1: L.icon({
        iconUrl: '/icons/red-a.png',
        iconSize: [25, 25],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    }),
    2: L.icon({
        iconUrl: '/icons/green-b.png',
        iconSize: [25, 25],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    }),
    3: L.icon({
        iconUrl: '/icons/blue-c.png',
        iconSize: [25, 25],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    })
};

// Add markers to the map using unit data
unitData.forEach(unit => {
    const marker = L.marker(unit.coords, { icon: customIcons[unit.id] || customIcons[1] }).addTo(map);
    marker.bindPopup(`<strong>${unit.name}</strong><br>${unit.details}`);

    // Optional: Store unit data on the marker for further use
    marker.unitInfo = unit;
});




// Create an Info Button Control
const InfoButtonControl = L.Control.extend({
    options: {
        position: 'topright' // Position of the button
    },

    onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
        container.style.backgroundColor = 'white';
        container.style.width = '30px';
        container.style.height = '30px';
        container.style.textAlign = 'center';
        container.style.cursor = 'pointer';
        container.innerHTML = 'ℹ️';

        container.onclick = function() {
            alert('Click a marker to view unit details.');
        };

        return container;
    }
});

// Add the custom control to the map
map.addControl(new InfoButtonControl());


function processExcelData(data) {
    data.forEach(row => {
        const lat = parseFloat(row.Latitude);
        const lng = parseFloat(row.Longitude);
        const id = parseInt(row.ID);
        const name = row["Unit Name"] || "Unnamed Unit";
        const details = row["Unit Type"] || "No details provided.";
        const equipment = row["Equipment"] || "No details provided.";
        const size = row["Unit Size"] || "No details provided.";

        if (!isNaN(lat) && !isNaN(lng)) {
            const icon = customIcons[id] || customIcons[1];
            const marker = L.marker([lat, lng], { icon }).addTo(map);
            marker.bindPopup(`<strong>${name}</strong><br>${details}<br>${equipment}<br>${size}`);
        } else {
            console.error("Invalid Latitude/Longitude in row:", row);
        }
    });
    alert("Units imported successfully!");
}

    
</script>




</body>
</html>
